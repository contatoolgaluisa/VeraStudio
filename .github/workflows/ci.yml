# Integração contínua: roda as mesmas verificações de `npm run check`
# a cada push e pull request. Um commit só é considerado bom se passar aqui.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # PostgreSQL temporário, criado só para esta execução do CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: vera_ci
          POSTGRES_DB: vera_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d vera_studio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vera:vera_ci@localhost:5432/vera_studio
      DIRECT_URL: postgresql://vera:vera_ci@localhost:5432/vera_studio
      TEST_DATABASE_URL: postgresql://vera:vera_ci@localhost:5432/vera_studio_test
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:3333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar banco de testes
        run: psql "postgresql://vera:vera_ci@localhost:5432/vera_studio" -c "CREATE DATABASE vera_studio_test;"

      # Cada verificação roda mesmo se a anterior falhar (`if: !cancelled()`),
      # para que um único CI mostre todos os problemas de uma vez.
      # O job continua falhando se qualquer etapa falhar.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Tipos (TypeScript)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Testes
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # Garante que as migrations e o seed funcionam do zero, como no deploy.
      - name: Migrations e seed
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          npm run db:deploy
          npm run db:seed

      # Se a formatação falhar, mostra no log exatamente o que o Prettier mudaria.
      - name: Formatação
        if: ${{ !cancelled() }}
        run: npm run format:check || (npx prettier --write . > /dev/null && git --no-pager diff && exit 1)
