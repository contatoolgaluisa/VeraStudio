# Integração contínua: roda as mesmas verificações de `npm run check`
# a cada push e pull request. Um commit só é considerado bom se passar aqui.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # PostgreSQL temporário, criado só para esta execução do CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: vera_ci
          POSTGRES_DB: vera_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d vera_studio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vera:vera_ci@localhost:5432/vera_studio
      DIRECT_URL: postgresql://vera:vera_ci@localhost:5432/vera_studio
      TEST_DATABASE_URL: postgresql://vera:vera_ci@localhost:5432/vera_studio_test
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:3333

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar banco de testes
        run: |
          psql "postgresql://vera:vera_ci@localhost:5432/vera_studio" -c "CREATE DATABASE vera_studio_test;"
          psql "postgresql://vera:vera_ci@localhost:5432/vera_studio" -c "CREATE DATABASE vera_studio_shadow;"

      # Cada verificação roda mesmo se a anterior falhar (`if: !cancelled()`),
      # para que um único CI mostre todos os problemas de uma vez.
      # O job continua falhando se qualquer etapa falhar.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Tipos (TypeScript)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Testes
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # Faz o que o `npm run db:migrate` faz na máquina de quem desenvolve:
      # aplica todas as migrations num banco vazio de conferência (shadow) e
      # compara o resultado com o schema.prisma. Falha se uma migration não
      # roda nesse banco ou se o SQL escrito à mão não bate com o schema.
      - name: Migrations conferem com o schema
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          SHADOW_DATABASE_URL: postgresql://vera:vera_ci@localhost:5432/vera_studio_shadow
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code \
            || (echo "As migrations não conferem com o schema.prisma (veja a diferença acima)."; exit 1)

      # Garante que as migrations e o seed funcionam do zero, como no deploy.
      - name: Migrations e seed
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          npm run db:deploy
          npm run db:seed

      # Sobe o build de produção como o Render faz (npm run start) e confere
      # que ele responde e acessa o banco. Pega erros que só aparecem no
      # código compilado (ex.: caminho de import errado em dist/).
      - name: Build de produção responde
        if: ${{ !cancelled() }}
        env:
          NODE_ENV: production
          PORT: 3400
          SUPABASE_URL: https://projeto-ci.supabase.co
        run: |
          npm run start -w backend > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3400/health/ready > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3400/health/ready || (cat /tmp/api.log; exit 1)
          curl -sf "http://localhost:3400/catalog/products?pageSize=1" | grep -q '"total":24' \
            || (echo "Catálogo não respondeu com os 24 produtos do seed"; cat /tmp/api.log; exit 1)

      # Se a formatação falhar, anota cada arquivo no PR com o que o Prettier mudaria.
      - name: Formatação
        if: ${{ !cancelled() }}
        run: |
          if npm run format:check; then exit 0; fi
          npx prettier --write . > /dev/null
          for file in $(git diff --name-only); do
            diff=$(git --no-pager diff --unified=1 -- "$file" | tail -n +5 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=$file,title=Formatação (rode npm run format)::$diff"
          done
          exit 1
